services:
  app:
    build: .
    container_name: cdn-optimizemefy-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - cdn-network

  caddy:
    image: caddy:2-alpine
    container_name: cdn-optimizemefy-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cdn-network

volumes:
  caddy_data:
  caddy_config:

networks:
  cdn-network: