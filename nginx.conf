# Einfache Nginx-Konfiguration für statische Dateien
server {
    listen 3000;
    server_name cdn.argiloff.eu;
    root /var/www/static;
    index index.html;

    # Grundlegende Sicherheitsheader
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Standard-Cache-Header
    expires 1h;
    add_header Cache-Control "public, max-age=3600";

    # Zugriffslog deaktivieren
    access_log off;
    error_log /dev/stderr;

    # Grundlegende Sicherheitseinstellungen
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # MIME-Typen
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Dateien ausliefern
    location / {
        try_files $uri $uri/ =404;
    }

    # Lange Cache-Zeiten für statische Assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Kein Caching für HTML-Dateien
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Versteckte Dateien nicht ausliefern
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}