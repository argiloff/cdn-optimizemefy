server {
    listen 80;
    server_name cdn.argiloff.eu;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Root-Verzeichnis für statische Dateien
    root /var/www/static;
    
    # Standard-Header für alle Antworten
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    
    # Standard-Cache-Header
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    
    location / {
        try_files $uri $uri/ =404;
        
        # Kein Caching für HTML-Dateien
        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
        
        # Lange Cache-Zeiten für statische Assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }
}